name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'lab/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'lab/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the built exe to a Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with the .NET Framework C# compiler
        shell: cmd
        run: build.cmd

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          if (-not (Test-Path 'ADACLSizeAudit.exe')) { throw 'ADACLSizeAudit.exe was not produced' }
          Get-Item 'ADACLSizeAudit.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADACLSizeAudit
          path: |
            ADACLSizeAudit.exe
            ADACLSizeAudit.exe.config
          if-no-files-found: error

      - name: Take the release notes from CHANGELOG.md (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver   = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern ('^## \[' + [regex]::Escape($ver) + '\]') | Select-Object -First 1).LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $ver" }
          $notes = @()
          for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## \[') { break }; $notes += $lines[$i] }
          $notes += ''
          $notes += 'Download `ADACLSizeAudit.exe` and `ADACLSizeAudit.exe.config` below and keep them in the same folder. Requires .NET Framework 4.0 or later.'
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Attach executable to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ADACLSizeAudit ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            ADACLSizeAudit.exe
            ADACLSizeAudit.exe.config
